name: GreenNet-Mobile CI/CD Telemetry Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-greennet-simulations:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.x
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Verify Environment & Permissions
      run: |
        python3 --version
        chmod +x run_all.py

    - name: Execute Master Simulator & Benchmark Suite
      run: |
        python3 run_all.py

    - name: Validate Benchmark Artifacts
      run: |
        if [ -f "benchmarks/latest_report.json" ]; then
          echo "[SUCCESS] Benchmark JSON report verified."
          cat benchmarks/latest_report.json
        else
          echo "[ERROR] Benchmark report missing!"
          exit 1
        fi
